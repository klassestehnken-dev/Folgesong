<style>
:root{--bg:#0e0f13;--panel:#171920;--line:#262934;--text:#eceef3;--mute:#8b90a0;--acc:#ff7a3d;--acc2:#ffb347;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
.search{position:relative}
#q{width:100%;font:inherit;font-size:17px;padding:14px 44px 14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
#q:focus{border-color:var(--acc)}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:6px 10px;display:none}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:10;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sg{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg.on,.sg:hover{background:#21242e}
.sg .t{font-weight:500}.sg .a{color:var(--mute);font-size:13px}
.sg .p{color:var(--mute);font-size:12px;white-space:nowrap;align-self:center}
mark{background:none;color:var(--acc2)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 6px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--mute);padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--acc);color:#111;font-weight:700}
.lbl{color:var(--mute);font-size:13px;margin-right:6px}
#nIn{width:58px;font:inherit;font-size:14px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:center}
.crumbs{margin:14px 0 0;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.head{margin:14px 0 12px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#2a1a12,#171920 60%);border:1px solid var(--line)}
.head .t{font-size:21px;font-weight:700}.head .a{color:var(--mute);margin-top:2px}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.stats b{color:var(--text);font-weight:500}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:11px 12px;border-radius:10px;cursor:pointer;align-items:center}
.row:hover{background:var(--panel)}
.rk{color:var(--mute);font-size:14px;text-align:right}
.rt{font-weight:500;line-height:1.25}.ra{color:var(--mute);font-size:13px}
.rc{text-align:right;white-space:nowrap}.rc b{font-size:16px}.rc span{display:block;color:var(--mute);font-size:12px}
.bar{grid-column:2 / 4;height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}
.meta{color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:30px 4px;text-align:center;line-height:1.5}
.hint{color:var(--mute);font-size:12px;margin-top:22px;line-height:1.5}
.top h3{font-size:14px;color:var(--mute);font-weight:500;margin:26px 0 8px}
.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;font:inherit;font-size:15px;background:none;border:0;color:var(--mute);padding:10px 4px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{font:inherit;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px}
.ghead h2{font-size:19px;margin:0}
.hidden{display:none!important}
.more{display:block;margin:16px auto 0;font:inherit;font-size:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 20px;border-radius:10px;cursor:pointer}
</style>
</head>

  for(const w of words){
    const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    out=out.replace(/(^|>)([^<]*)(?=<|$)/g,(m,p,txt)=>p+txt.replace(re,'<mark>$1</mark>'));
  }
  return out;
}
let sel=-1, cur=[];
function renderSugg(){
  const text=q.value; clearB.style.display=text?'block':'none';
  cur=search(text); sel=cur.length?0:-1;
  if(!cur.length){ sugg.style.display = text.trim()? 'block':'none'; sugg.innerHTML = text.trim()?'<div class="sg"><span class="a">Kein Treffer</span></div>':''; return; }
  sugg.innerHTML=cur.map((i,k)=>`<div class="sg${k===sel?' on':''}" data-i="${i}"><div><div class="t">${hl(S[i][0],text)}</div><div class="a">${hl(S[i][1],text)}</div></div><div class="p">${fmt(S[i][2])}×</div></div>`).join('');
  sugg.style.display='block';
}
function moveSel(d){ if(!cur.length)return; sel=(sel+d+cur.length)%cur.length; [...sugg.children].forEach((c,k)=>c.classList.toggle('on',k===sel)); }
q.addEventListener('input',renderSugg);
q.addEventListener('focus',()=>{ if(q.value) renderSugg(); });
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);}
  else if(e.key==='Enter'){ if(sel>=0) pick(cur[sel], true); }
  else if(e.key==='Escape'){ sugg.style.display='none'; }
});
sugg.addEventListener('mousedown',e=>{const el=e.target.closest('.sg[data-i]'); if(el){e.preventDefault(); pick(+el.dataset.i, true);}});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) sugg.style.display='none'; });
clearB.addEventListener('click',()=>{q.value='';renderSugg();q.focus();});

function pick(i, fresh){
  if(fresh) state.trail=[]; else if(state.song!==null) state.trail.push(state.song);
  state.song=i; q.value=''; clearB.style.display='none'; sugg.style.display='none'; q.blur();
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function setN(n){ n=Math.max(1,Math.min(500,parseInt(n)||10)); state.n=n; document.getElementById('nIn').value=n;
  document.querySelectorAll('#cnt button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n)); save(); render(); }
document.querySelectorAll('#cnt button').forEach(b=>b.addEventListener('click',()=>setN(+b.dataset.n)));
document.getElementById('nIn').addEventListener('change',e=>setN(e.target.value));
document.querySelectorAll('#dir button').forEach(b=>b.addEventListener('click',()=>{state.dir=b.dataset.d;
  document.querySelectorAll('#dir button').forEach(x=>x.classList.toggle('on',x===b)); save(); render();}));

function render(){
  const cr=document.getElementById('crumbs');
  if(state.song===null){ cr.innerHTML=''; renderStart(); return; }
  cr.innerHTML = state.trail.length ? state.trail.map((i,k)=>`<a data-k="${k}">${esc(S[i][0])}</a> ›`).join(' ')+` <span>${esc(S[state.song][0])}</span>` : '';
  cr.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{const k=+a.dataset.k; state.song=state.trail[k]; state.trail=state.trail.slice(0,k); render();}));
  document.getElementById('tolBox').classList.toggle('hidden',state.dir!=='match');
  if(state.dir==='match'){ renderMatch(); return; }
  const s=S[state.song], lst=(state.dir==='next'?NEXT:PREV)[state.song], tot=sum(lst), top=lst.slice(0,state.n), mx=top.length?top[0][1]:1;
  let h=`<div class="head"><div class="t">${esc(s[0])}</div><div class="a">${esc(s[1])}</div>
    <div class="stats">${D.G?`<span><b>${esc(D.G[s[5]])}</b>${s[6]?` · ${s[6]}`:''}</span>`:''}<span><b>${fmt(s[2])}×</b> gespielt</span>${s[3]?`<span><b>${s[3]}</b> BPM</span>`:''}${s[4]?`<span>Key <b>${s[4]}</b></span>`:''}<span><b>${fmt(lst.length)}</b> verschiedene Songs ${state.dir==='next'?'danach':'davor'}</span></div></div>`;
  if(!top.length) h+=`<div class="empty">Keine ${state.dir==='next'?'Folgesongs':'Vorgänger'} gefunden – der Song lief wohl immer als ${state.dir==='next'?'letzter':'erster'}.</div>`;
  h+=top.map(([j,c],k)=>{const t=S[j];return `<div class="row" data-j="${j}"><div class="rk">${k+1}</div>
    <div><div class="rt">${esc(t[0])}</div><div class="ra">${esc(t[1])}${bk(t)}</div></div>
    <div class="rc"><b>${c}×</b><span>${(c/tot*100).toFixed(1).replace('.',',')} %</span></div>
    <div class="bar"><i style="width:${c/mx*100}%"></i></div></div>`;}).join('');
  if(top.length) h+=`<div class="hint">Antippen, um von diesem Song aus weiterzusuchen. Prozent = Anteil an allen ${fmt(tot)} Übergängen ${state.dir==='next'?'nach':'vor'} „${esc(s[0])}“.</div>`;
  out.innerHTML=h;
  out.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>pick(+r.dataset.j,false)));
}
function renderStart(){
  const top=S.map((s,i)=>i).slice(0,state.n);
  out.innerHTML=`<div class="top"><h3>Deine meistgespielten Songs – antippen zum Starten</h3>`+
   top.map((j,k)=>`<div class="row" data-j="${j}"><div class="rk">${k+1}</div><div><div class="rt">${esc(S[j][0])}</div><div class="ra">${esc(S[j][1])}${bk(S[j])}</div></div><div class="rc"><b>${fmt(S[j][2])}×</b></div></div>`).join('')+`</div>
   <div class="hint">Gleiche Songs in verschiedenen Versionen (Radio Edit, Extended, Intro Edit …) sind zusammengefasst. Kurz angespielte Tracks unter 30 Sekunden zählen nicht.</div>`;
  out.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>pick(+r.dataset.j,true)));
}

const GEN = D.g || [];
let gsel = 0, gN = 25, view='finder';
try{const sv=JSON.parse(localStorage.getItem('fsf')||'{}'); if(typeof sv.g==='number'&&sv.g<GEN.length) gsel=sv.g;}catch(e){}
function setView(v){ view=v;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('vFinder').classList.toggle('hidden',v!=='finder');
  document.getElementById('vGenres').classList.toggle('hidden',v!=='genres');
  document.getElementById('vTop').classList.toggle('hidden',v!=='top');
  if(v==='genres') renderGenres(); if(v==='top') renderTop(); }
let topN=100;
function renderTop(){
  const mx=S[0][2];
  let h=`<div class="ghead"><h2>Meistgespielte Songs</h2><span class="meta">Platz 1–${Math.min(topN,S.length)} von ${fmt(S.length)}</span></div>`;
  h+=S.slice(0,topN).map((s,k)=>`<div class="row" data-j="${k}"><div class="rk">${k+1}</div>
    <div><div class="rt">${esc(s[0])}</div><div class="ra">${esc(s[1])}${bk(s)}</div></div>
    <div class="rc"><b>${fmt(s[2])}×</b></div><div class="bar"><i style="width:${s[2]/mx*100}%"></i></div></div>`).join('');
  if(topN<S.length) h+=`<button class="more" id="moreBtn">Weitere 100 anzeigen</button>`;
  h+=`<div class="hint">Antippen zeigt die Folgesongs. Verschiedene Versionen eines Songs sind zusammengezählt.</div>`;
  const o=document.getElementById('tout'); o.innerHTML=h;
  o.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{setView('finder'); pick(+r.dataset.j,true);}));
  const mb=document.getElementById('moreBtn'); if(mb) mb.addEventListener('click',()=>{topN+=100; renderTop();});
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
function renderGenres(){
  document.getElementById('chips').innerHTML = GEN.map((g,k)=>`<button data-k="${k}" class="${k===gsel?'on':''}">${esc(g[0])}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>{gsel=+b.dataset.k;
    try{const sv=JSON.parse(localStorage.getItem('fsf')||'{}');sv.g=gsel;localStorage.setItem('fsf',JSON.stringify(sv))}catch(e){}
    gN=25; renderGenres();}));
  const [name, list] = GEN[gsel], mx = list.length?list[0][1]:1;
  let h = `<div class="ghead"><h2>${esc(name)}</h2><span class="meta">${fmt(list.length)} Songs · Plays</span></div>`;
  h += list.slice(0,gN).map(([j,p],k)=>`<div class="row" data-j="${j}"><div class="rk">${k+1}</div>
    <div><div class="rt">${esc(S[j][0])}</div><div class="ra">${esc(S[j][1])}${bk(S[j])}</div></div>
    <div class="rc"><b>${fmt(p)}×</b></div><div class="bar"><i style="width:${p/mx*100}%"></i></div></div>`).join('');
  if(gN<list.length) h+=`<button class="more" id="gMore">Weitere 50 anzeigen</button>`;
  h += `<div class="hint">Antippen zeigt die Folgesongs. Jeder Song steht in genau einer Liste. Die meistgespielten Songs sind von Hand geprüft, die übrigen nach Online-Daten (Deezer, MusicBrainz) und deinen Sets zugeordnet. Jahrzehnte nach erstem Erscheinungsjahr, die 2020er enthalten alle Stile.</div>`;
  document.getElementById('gout').innerHTML = h;
  const gm=document.getElementById('gMore'); if(gm) gm.addEventListener('click',()=>{gN+=50; renderGenres();});
  document.querySelectorAll('#gout .row').forEach(r=>r.addEventListener('click',()=>{setView('finder'); pick(+r.dataset.j,true);}));
}

const CAT=S.map(s=>s[5]??-1), GN=D.G||[];
state.tol=5; state.km=1; state.gm=1;
try{const sv=JSON.parse(localStorage.getItem('fsf')||'{}'); if(sv.tol)state.tol=sv.tol; if(sv.km!==undefined)state.km=sv.km; if(sv.gm!==undefined)state.gm=sv.gm;}catch(e){}
const saveM=()=>{try{const sv=JSON.parse(localStorage.getItem('fsf')||'{}');sv.tol=state.tol;sv.km=state.km;sv.gm=state.gm;localStorage.setItem('fsf',JSON.stringify(sv))}catch(e){}};
function wire(id,attr,key){document.querySelectorAll('#'+id+' button').forEach(b=>{b.classList.toggle('on',+b.dataset[attr]===state[key]);
  b.addEventListener('click',()=>{state[key]=+b.dataset[attr];document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));saveM();render();});});}
wire('tol','t','tol'); wire('kmode','k','km'); wire('gmode','g','gm');
const pk=k=>{const m=/^(\d{1,2})([AB])$/.exec(k||'');return m?[+m[1],m[2]]:null;};
function keyRel(a,b){const x=pk(a),y=pk(b);if(!x||!y)return null;
  if(x[0]===y[0]&&x[1]===y[1])return 'gleicher Key';
  if(x[0]===y[0])return 'Dur/Moll-Wechsel';
  const d=(y[0]-x[0]+12)%12; if(x[1]===y[1]&&(d===1||d===11))return d===1?'+1':'−1';
  return null;}
// Tempo-Abstand: auch halbes/doppeltes Tempo zählt (73 ↔ 146 BPM)
function tempo(b,t){let best=[t-b,''];for(const [x,lab] of [[t*2,'halb'],[t/2,'doppelt']]){const d=Math.round(x-b);if(Math.abs(d)<Math.abs(best[0]))best=[d,lab];}return best;}
function renderMatch(){
  const i=state.song, s=S[i], c=CAT[i], b=s[3], k=s[4];
  const nx=new Map(NEXT[i]), pv=new Map(PREV[i]);
  const useKey=state.km===1&&pk(k), useG=state.gm===1&&c>=0;
  let h=`<div class="head"><div class="t">${esc(s[0])}</div><div class="a">${esc(s[1])}</div>
    <div class="stats"><span><b>${fmt(s[2])}×</b> gespielt</span>${b?`<span><b>${b}</b> BPM</span>`:''}${k?`<span>Key <b>${k}</b></span>`:''}<span><b>${c>=0?esc(GN[c]):'kein Genre'}</b></span></div></div>`;
  if(!b){ out.innerHTML=h+`<div class="empty">Für diesen Song ist kein BPM-Wert gespeichert.</div>`; return; }
  const notes=[];
  if(state.gm===1&&c<0) notes.push('Dieser Song ist keinem Genre zugeordnet. Deshalb zählen nur BPM und Key.');
  if(state.km===1&&!pk(k)) notes.push('Für diesen Song ist kein Key gespeichert. Deshalb wird der Key nicht berücksichtigt.');
  const res=[];
  for(let j=0;j<S.length;j++){ if(j===i||!S[j][3]) continue;
    const [d]=tempo(b,S[j][3]); if(Math.abs(d)>state.tol) continue;
    if(useG && CAT[j]!==c) continue;
    const rel=keyRel(k,S[j][4]);
    if(useKey && !rel) continue;
    res.push([j,rel]);}
  res.sort((x,y)=>S[y[0]][2]-S[x[0]][2]);
  const top=res.slice(0,state.n), mx=top.length?S[top[0][0]][2]:1;
  if(notes.length) h+=`<div class="hint" style="margin:0 0 8px">${notes.join(' ')}</div>`;
  if(!top.length) h+=`<div class="empty">Keine passenden Songs gefunden. Probier einen größeren BPM-Bereich${useKey?' oder Key „egal“':''}${useG?' oder Genre „egal“':''}.</div>`;
  h+=top.map(([j,rel],n)=>{const t=S[j], [d,tl]=tempo(b,t[3]), f=nx.get(j)||0, p=pv.get(j)||0;
    return `<div class="row" data-j="${j}"><div class="rk">${n+1}</div>
    <div><div class="rt">${esc(t[0])}</div><div class="ra">${esc(t[1])} · ${t[3]} BPM (${tl?tl+'es Tempo, ':''}${d>0?'+':d<0?'−':'±'}${Math.abs(d)})${t[4]?` · ${t[4]}${rel?' ('+rel+')':''}`:''}${!useG&&CAT[j]>=0?' · '+esc(GN[CAT[j]]):''}${f?` · schon ${f}× danach`:''}${!f&&p?` · ${p}× davor`:''}</div></div>
    <div class="rc"><b>${fmt(t[2])}×</b><span>gespielt</span></div>
    <div class="bar"><i style="width:${t[2]/mx*100}%"></i></div></div>`;}).join('');
  if(top.length) h+=`<div class="hint">${fmt(res.length)} Songs mit ±${state.tol} BPM (auch halbes/doppeltes Tempo)${useG?' im Genre „'+esc(GN[c])+'“':' (alle Genres)'}${useKey?' und harmonisch passendem Key (gleich, ±1 oder Dur/Moll-Wechsel)':''}, sortiert nach deinen Plays.</div>`;
  out.innerHTML=h;
  out.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>pick(+r.dataset.j,false)));
}
setN(state.n);
document.querySelectorAll('#dir button').forEach(x=>x.classList.toggle('on',x.dataset.d===state.dir));
</script>
</body>
</html>
